<svg xmlns="http://www.w3.org/2000/svg" width="960" height="680" viewBox="0 0 960 680" role="img" aria-labelledby="title desc">
  <title id="title">Analytics command center visual</title>
  <desc id="desc">A polished analytics command center showing business context, data tools, modeling methods, dashboards, and decision outcomes.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3f7fb"/>
    </linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102a43"/>
      <stop offset="1" stop-color="#1f5f8b"/>
    </linearGradient>
    <linearGradient id="softBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9f3fa"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="softGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e7f4ed"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="shadow" x="-18%" y="-18%" width="136%" height="136%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#102a43" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="960" height="680" fill="#ffffff"/>
  <rect x="36" y="36" width="888" height="608" rx="26" fill="url(#canvas)" stroke="#d9e2ea"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="78" y="96" font-size="28" font-weight="800" fill="#102a43">Analytics Command Center</text>
    <text x="78" y="128" font-size="16" fill="#596777">From business questions to insight, action, and measurable decisions</text>

    <rect x="78" y="162" width="804" height="88" rx="18" fill="url(#primary)" filter="url(#shadow)"/>
    <text x="116" y="202" font-size="18" font-weight="800" fill="#ffffff">Business Context</text>
    <text x="116" y="226" font-size="14" fill="#d7e2ef">Revenue, customers, operations, process improvement, and stakeholder decisions</text>

    <g transform="translate(654 185)">
      <rect x="0" y="0" width="178" height="42" rx="21" fill="#ffffff" opacity="0.96"/>
      <circle cx="25" cy="21" r="9" fill="#24735b"/>
      <text x="46" y="26" font-size="13" font-weight="800" fill="#102a43">Decision Support</text>
    </g>

    <rect x="78" y="292" width="238" height="208" rx="18" fill="#ffffff" stroke="#d9e2ea" filter="url(#shadow)"/>
    <text x="110" y="336" font-size="18" font-weight="800" fill="#102a43">Data Layer</text>
    <text x="110" y="362" font-size="14" fill="#596777">Clean, structure, join,</text>
    <text x="110" y="384" font-size="14" fill="#596777">and prepare data for</text>
    <text x="110" y="406" font-size="14" fill="#596777">reliable analysis.</text>
    <g transform="translate(110 432)">
      <rect width="54" height="48" rx="8" fill="#e9f3fa"/>
      <rect x="70" width="54" height="48" rx="8" fill="#e7f4ed"/>
      <rect x="140" width="54" height="48" rx="8" fill="#fff4dc"/>
      <text x="27" y="30" font-size="12" font-weight="800" text-anchor="middle" fill="#1f5f8b">SQL</text>
      <text x="97" y="30" font-size="12" font-weight="800" text-anchor="middle" fill="#24735b">ETL</text>
      <text x="167" y="30" font-size="12" font-weight="800" text-anchor="middle" fill="#9f6b16">BI</text>
    </g>

    <rect x="361" y="292" width="238" height="208" rx="18" fill="#ffffff" stroke="#d9e2ea" filter="url(#shadow)"/>
    <text x="393" y="336" font-size="18" font-weight="800" fill="#102a43">Analytics Layer</text>
    <text x="393" y="362" font-size="14" fill="#596777">Model, mine, classify,</text>
    <text x="393" y="384" font-size="14" fill="#596777">forecast, and evaluate</text>
    <text x="393" y="406" font-size="14" fill="#596777">business patterns.</text>
    <g transform="translate(393 430)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 48 C36 8 72 70 108 30 C136 0 166 18 194 8" stroke="#1f5f8b" stroke-width="6"/>
      <path d="M0 76 L194 76" stroke="#d9e2ea" stroke-width="3"/>
      <circle cx="108" cy="30" r="8" fill="#24735b" stroke="#ffffff" stroke-width="3"/>
    </g>

    <rect x="644" y="292" width="238" height="208" rx="18" fill="#ffffff" stroke="#d9e2ea" filter="url(#shadow)"/>
    <text x="676" y="336" font-size="18" font-weight="800" fill="#102a43">Communication Layer</text>
    <text x="676" y="362" font-size="14" fill="#596777">Turn analysis into</text>
    <text x="676" y="384" font-size="14" fill="#596777">dashboards, stories,</text>
    <text x="676" y="406" font-size="14" fill="#596777">and clear next steps.</text>
    <g transform="translate(676 430)">
      <rect x="0" y="34" width="28" height="44" rx="5" fill="#1f5f8b"/>
      <rect x="44" y="16" width="28" height="62" rx="5" fill="#24735b"/>
      <rect x="88" y="0" width="28" height="78" rx="5" fill="#9f6b16"/>
      <rect x="132" y="24" width="28" height="54" rx="5" fill="#8f445c"/>
    </g>

    <g font-size="13" font-weight="800">
      <rect x="118" y="542" width="116" height="34" rx="17" fill="url(#softBlue)" stroke="#d9e2ea"/>
      <text x="176" y="564" text-anchor="middle" fill="#102a43">Python</text>
      <rect x="246" y="542" width="126" height="34" rx="17" fill="url(#softBlue)" stroke="#d9e2ea"/>
      <text x="309" y="564" text-anchor="middle" fill="#102a43">Google Colab</text>
      <rect x="384" y="542" width="82" height="34" rx="17" fill="url(#softGreen)" stroke="#d9e2ea"/>
      <text x="425" y="564" text-anchor="middle" fill="#102a43">R</text>
      <rect x="478" y="542" width="96" height="34" rx="17" fill="url(#softGreen)" stroke="#d9e2ea"/>
      <text x="526" y="564" text-anchor="middle" fill="#102a43">Tableau</text>
      <rect x="586" y="542" width="106" height="34" rx="17" fill="#fff4dc" stroke="#d9e2ea"/>
      <text x="639" y="564" text-anchor="middle" fill="#102a43">SQL Server</text>
      <rect x="704" y="542" width="136" height="34" rx="17" fill="#f8edf1" stroke="#d9e2ea"/>
      <text x="772" y="564" text-anchor="middle" fill="#102a43">RapidMiner</text>
    </g>

    <rect x="260" y="606" width="440" height="2" rx="1" fill="#d9e2ea"/>
    <text x="480" y="634" font-size="15" font-weight="800" text-anchor="middle" fill="#102a43">Practical analytics for revenue, customers, and operations</text>
  </g>
</svg>
